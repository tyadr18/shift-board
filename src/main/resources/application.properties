spring.application.name=shift-board

# --- ログインユーザー（環境変数で上書きする） ---
# 未設定時はデモ用の値（demo / demo-pass）で起動する。公開環境では必ず APP_PASSWORD を設定すること。
app.login.username=${APP_USERNAME:demo}
app.login.password=${APP_PASSWORD:demo-pass}

# --- 起動時に架空のサンプルデータを入れるか ---
app.demo-data.enabled=${APP_DEMO_DATA:true}

# --- DB（H2 インメモリ。再起動するとデータは消える） ---
spring.datasource.url=jdbc:h2:mem:shiftboard;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --- 画面 ---
spring.thymeleaf.cache=false
spring.messages.basename=messages
server.error.include-stacktrace=never
server.error.include-message=never
