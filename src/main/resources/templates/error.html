<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('エラー')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1 th:text="${status} + ' ' + ${error}">500 Internal Server Error</h1>
    <div class="card">
        <p th:if="${message}" th:text="${message}">メッセージ</p>
        <p th:unless="${message}" th:switch="${status}">
            <span th:case="403">この操作は許可されていません。画面を再読み込みしてからやり直してください。</span>
            <span th:case="404">ページが見つかりませんでした。</span>
            <span th:case="*">エラーが発生しました。時間をおいてもう一度お試しください。</span>
        </p>
        <a th:href="@{/shifts}" class="button">一覧に戻る</a>
    </div>
</main>
</body>
</html>
