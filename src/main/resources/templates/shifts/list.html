<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('シフト希望一覧')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="page-title">
        <h1>シフト希望一覧</h1>
        <a th:href="@{/shifts/new}" class="button">＋ 新しい希望を登録</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/shifts}" th:object="${search}" method="get" class="card filter">
        <div class="field">
            <label for="staffName">スタッフ名（部分一致）</label>
            <input type="text" th:field="*{staffName}" placeholder="例: スタッフA">
        </div>
        <div class="field">
            <label for="from">期間（開始）</label>
            <input type="date" th:field="*{from}">
        </div>
        <div class="field">
            <label for="to">期間（終了）</label>
            <input type="date" th:field="*{to}">
        </div>
        <div class="actions">
            <button type="submit" class="button">絞り込む</button>
            <a th:href="@{/shifts}" class="button secondary">条件をクリア</a>
        </div>
        <ul th:if="${#fields.hasAnyErrors()}" class="alert error" role="alert">
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}">エラー</li>
        </ul>
    </form>

    <p class="count" th:text="${#lists.size(shifts)} + ' 件'">0 件</p>

    <table th:if="${!#lists.isEmpty(shifts)}" class="table">
        <thead>
        <tr>
            <th scope="col">日付</th>
            <th scope="col">時間帯</th>
            <th scope="col">スタッフ名</th>
            <th scope="col">備考</th>
            <th scope="col">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="shift : ${shifts}">
            <td th:text="${#temporals.format(shift.workDate, 'yyyy/MM/dd')}">2026/12/01</td>
            <td>
                <span class="slot" th:classappend="${'slot-' + #strings.toLowerCase(shift.timeSlot.name())}"
                      th:text="${shift.timeSlot.label}">早番</span>
                <small th:text="${shift.timeSlot.hours}">09:00〜13:00</small>
            </td>
            <td th:text="${shift.staffName}">スタッフA</td>
            <td class="note" th:text="${shift.note}">備考</td>
            <td class="row-actions">
                <a th:href="@{/shifts/{id}/edit(id=${shift.id})}" class="button small secondary">編集</a>
                <form th:action="@{/shifts/{id}/delete(id=${shift.id})}" method="post" class="inline"
                      onsubmit="return confirm('このシフト希望を削除しますか？');">
                    <button type="submit" class="button small danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(shifts)}" class="empty">該当するシフト希望はありません。</p>
</main>
</body>
</html>
